<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra</title>

<!-- Diagnostica inline, PRIMA di ogni altra cosa.
     Se il CSS o un JS non arrivano, senza questo la pagina fallisce in
     silenzio e non si distingue "codice rotto" da "file non servito".
     Qui ogni problema viene scritto a schermo, dove si vede. -->
<style>
  #diag {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
    background: #2a1e16; color: #ffcf9b; border-top: 2px solid #f5a623;
    font: 12px/1.5 ui-monospace, Consolas, monospace;
    padding: 6px 10px; max-height: 34vh; overflow-y: auto;
    white-space: pre-wrap;
  }
  #diag.ok { background: #14322a; color: #9fe8c4; border-top-color: #3ecf8e; }
  #diag.err { background: #2a1618; color: #ffb4b4; border-top-color: #ff6b6b; }
</style>
<script>
(function () {
  var lines = [];
  var box;
  function render() {
    if (!box) return;
    box.textContent = lines.join("\n");
    box.className = window.__diagErrors.length ? "err" : "ok";
  }
  function add(t) { lines.push(t); window.__diagErrors.push(t); render(); }
  window.__diagErrors = [];
  window.__diagInline = true;
  window.addEventListener("error", function (e) {
    var f = (e.filename || "?").split("/").pop();
    add("ERRORE: " + (e.message || "?") + " @ " + f + ":" + (e.lineno || 0));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    add("PROMESSA RIFIUTATA: " + String((e.reason && e.reason.message) || e.reason));
  });
  document.addEventListener("DOMContentLoaded", function () {
      box = document.createElement("div");
      box.id = "diag";
      document.body.appendChild(box);
      // Non controlliamo il CSS qui: DOMContentLoaded puo' precedere
      // l'applicazione dello stylesheet, e il controllo dava un falso
      // negativo. Lo facciamo dopo, con un timer, e su piu' proprieta'.
      setTimeout(function () {
        var cs = getComputedStyle(document.body);
        // il body deve essere flex: e' nel nostro CSS e non puo' essere un
        // default del browser. Il colore da solo e' ambiguo.
        var disp = cs.display || "";
        var bg = cs.backgroundColor || "";
        var flexOk = disp.indexOf("flex") >= 0;
        var bgOk = bg.indexOf("15, 17, 21") >= 0 || bg.indexOf("15,17,21") >= 0;
        if (!flexOk && !bgOk) {
          add("CSS NON APPLICATO: display=" + disp + " background=" + bg);
          add("  -> app.css non e' arrivato, o il browser lo ha rifiutato");
        } else {
          lines.unshift("css:ok (display=" + disp + ")");
        }
        var mp = document.getElementById("model-pick");
                if (mp) {
                  var voci = mp.options ? mp.options.length : mp.children.length;
                  lines.push("selettore: " + voci + " voci, " +
                             (mp.disabled ? "DISABILITATO" : "attivo"));
                }
                // I marcatori dicono se i file hanno ESEGUITO. Ma distinguere
                      // "il browser non li ha chiesti" da "li ha chiesti e ha ricevuto
                      // un rifiuto" e' la domanda giusta: la facciamo con fetch.
                      var f = window.__diagFiles || [];
                      var mancanti = ["core", "panels", "main"].filter(function (n) {
                        return f.indexOf(n) < 0;
                      });
                      if (!mancanti.length) {
                        lines.unshift("js eseguiti: " + f.join(" + "));
                        render();
                        return;
                      }
                      // non eseguono: chiediamo noi gli stessi file e riportiamo lo stato
                      lines.unshift("js NON eseguiti: " + mancanti.join(","));
                      Promise.all(mancanti.map(function (n) {
                        return fetch("/" + n + ".js", { cache: "no-store" })
                          .then(function (r) {
                            return n + " -> HTTP " + r.status + " " +
                                   (r.headers.get("content-type") || "?") + " " +
                                   (r.headers.get("content-length") || "?") + " byte";
                          })
                          .catch(function (e) { return n + " -> FETCH FALLITA: " + e.message; });
                      })).then(function (risposte) {
                        risposte.forEach(function (r) { lines.push("  " + r); });
                        lines.push("  -> se tornano HTTP 200, il server va bene: e' il browser");
                        lines.push("     che non esegue i file. Guarda DevTools > Network.");
                        render();
                      });
                      render();
      }, 1500);
      render();
    });
  })();
</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- Ogni file JS ci scrive il proprio nome quando esegue. Se questo
     elemento si riempie, i file partono; se resta vuoto, non partono.
     Niente console da aprire, niente supposizioni. -->
<div id="diag-files" style="position:fixed;top:0;right:0;z-index:9999;background:#14322a;color:#9fe8c4;font:12px ui-monospace,Consolas,monospace;padding:4px 10px;border:1px solid #3ecf8e;border-radius:0 0 0 6px;">&nbsp;</div>

<header>
  <div class="logo">Orches<span>tra</span></div>
  <span class="ver" id="ver" title="versione della interfaccia">·</span>
  <span class="stamp" id="stamp">UI-4</span>
  <div class="grow"></div>
  <button id="btn-bench" class="ghost">Benchmark</button>
  <select id="model-pick" title="Modello in uso" disabled>
    <option value="">modello…</option>
  </select>
  <div class="dot" id="dot"></div>
  <div class="stat" id="stats">—</div>
  <button id="btn-cancel" disabled>Annulla</button>
  <button id="btn-reset">Nuova</button>
</header>

<!-- pannello benchmark: overlay, non una pagina a se' */
<div id="bench" class="panel hidden">
  <div class="panel-box">
    <div class="panel-head">
      <div>
        <b>Benchmark</b>
        <span class="dim">misura cosa sa fare ogni modello, per categoria</span>
      </div>
      <button id="bench-close" class="ghost">Chiudi</button>
    </div>
    <div class="bench-controls">
      <label>Modelli
        <select id="bench-sample">
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="6">6</option>
        </select>
      </label>
      <label>Categoria
        <select id="bench-cat">
          <option value="all">tutte</option>
          <option value="code">codice</option>
          <option value="reasoning">ragionamento</option>
          <option value="instruction">istruzioni</option>
          <option value="tool_use">uso tool</option>
        </select>
      </label>
      <button id="bench-run" class="primary">Avvia</button>
    </div>
    <div id="bench-note" class="dim small">
      Costa token reali. I modelli <code>:free</code> non costano nulla.
      n=1 per task: indicazione, non statistica.
    </div>
    <pre id="bench-log" class="benchlog"></pre>
    <div id="bench-out"></div>
  </div>
</div>

<main id="main">
  <div class="wrap" id="log"></div>
</main>

<footer>
  <div class="cwrap">
    <div class="row">
      <textarea id="input" placeholder="Scrivi un compito…  (Invio per inviare, Shift+Invio per a capo)" disabled></textarea>
      <button class="primary" id="btn-send" disabled>Invia</button>
    </div>
    <div class="hint">
      <span><kbd>Invio</kbd> invia</span>
      <span><kbd>Shift</kbd>+<kbd>Invio</kbd> a capo</span>
      <span id="conn">connessione…</span>
    </div>
  </div>
</footer>

<script src="/app.js"></script>
</body>
</html>
