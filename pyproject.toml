[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
dynamic = ["version"]
description = "Orchestratore agentico in Python puro"
requires-python = ">=3.11"

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.setuptools.dynamic]
version = { attr = "orchestra.__version__" }

[tool.setuptools.packages.find]
include = ["orchestra*"]