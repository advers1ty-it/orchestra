[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
dynamic = ["version"]
description = "Orchestratore agentico in Python puro"
requires-python = ">=3.11"
# AGPL-3.0-or-later: le versioni modificate restano libere allo stesso
# modo, e chi offre Orchestra come servizio in rete deve dare il sorgente.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.setuptools.dynamic]
version = { attr = "orchestra.__version__" }

[tool.setuptools.packages.find]
include = ["orchestra*"]